resources:
  jobs:
    Youtube_Earthquake_End_to_End_Job:
      name: Youtube_Earthquake_End_to_End_Job
      tasks:
        - task_key: Injestion_Bronze
          notebook_task:
            notebook_path: ../src/notebooks/Ingestion_Bronze.ipynb
            base_parameters:
              catalog_name: ${var.catalog}
            source: WORKSPACE
        - task_key: Bronze_Silver_EarthQuackData
          depends_on:
            - task_key: Injestion_Bronze
          pipeline_task:
            pipeline_id: ${resources.pipelines.bronze_silver_earthquake_etl.id}
        - task_key: EarthQuake_Dashboard
          depends_on:
            - task_key: Bronze_Silver_EarthQuackData
          dashboard_task:
            subscription: {}
            warehouse_id: a5721d2e51643a49
            dashboard_id: ${resources.dashboards.earthquake_monitor.id}
      queue:
        enabled: true
      parameters:
        - name: catalog_name
          default: ${var.catalog}
      performance_target: PERFORMANCE_OPTIMIZED
